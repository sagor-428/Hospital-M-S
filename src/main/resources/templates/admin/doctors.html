<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Doctors | Hospital Management System</title>

    <th:block th:replace="~{fragments/head-assets :: styles}"></th:block>

</head>

<body>

<div class="app-shell">

    <th:block th:replace="~{fragments/sidebar :: sidebar(role='ADMIN', active='doctors')}"></th:block>

    <div class="app-main">

        <th:block th:replace="~{fragments/topbar :: topbar}"></th:block>

        <main class="app-content">

            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">
                <span th:text="${error}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-header">
                <div>
                    <h1>Doctors</h1>
                    <p>Onboard doctors and manage their accounts.</p>
                </div>
                <div class="actions">
                    <a th:href="@{/admin/doctors/add}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> Add doctor
                    </a>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">

                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Specialization</th>
                                <th>Department</th>
                                <th>Experience</th>
                                <th class="text-end">Action</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="doctor : ${doctors}">

                                <td th:text="${doctor.id}">1</td>

                                <td>
                                    <strong th:text="${'Dr. ' + doctor.user.name}">Doctor</strong>
                                </td>

                                <td th:text="${doctor.user.email}">doctor@gmail.com</td>

                                <td th:text="${doctor.specialization}">Cardiologist</td>

                                <td th:text="${doctor.department.name}">Cardiology</td>

                                <td th:text="${doctor.experience != null ? doctor.experience + ' years' : 'N/A'}">
                                    5 years
                                </td>

                                <td class="text-end">
                                    <form th:action="@{/admin/doctors/delete/{id}(id=${doctor.id})}" method="post"
                                          class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this doctor?');">
                                            <i class="bi bi-trash me-1"></i>Delete
                                        </button>
                                    </form>
                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(doctors)}">
                                <td colspan="7">
                                    <div class="empty-state">
                                        <i class="bi bi-people"></i>
                                        <h5>No doctors yet</h5>
                                        <p class="mb-0">Add your first doctor to get started.</p>
                                    </div>
                                </td>
                            </tr>

                            </tbody>

                        </table>
                    </div>
                </div>
            </div>

        </main>

        <th:block th:replace="~{fragments/footer :: dashboardFooter}"></th:block>

    </div>

</div>

<th:block th:replace="~{fragments/scripts :: bootstrapJs}"></th:block>

</body>
</html>
