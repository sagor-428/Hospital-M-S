<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Department | Hospital Management System</title>

    <th:block th:replace="~{fragments/head-assets :: styles}"></th:block>

</head>

<body>

<div class="app-shell">

    <th:block th:replace="~{fragments/sidebar :: sidebar(role='ADMIN', active='departments')}"></th:block>

    <div class="app-main">

        <th:block th:replace="~{fragments/topbar :: topbar}"></th:block>

        <main class="app-content">

            <div class="page-header">
                <div>
                    <h1>Add department</h1>
                    <p>Departments group doctors by specialty area.</p>
                </div>
            </div>

            <div class="row justify-content-start">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-body p-4">

                            <form th:action="@{/admin/departments/save}" th:object="${department}" method="post">

                                <div class="mb-3">
                                    <label class="form-label">Department name</label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                           placeholder="e.g. Cardiology" required>
                                </div>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">Save department</button>
                                    <a th:href="@{/admin/departments}" class="btn btn-outline-secondary">Cancel</a>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>
            </div>

        </main>

        <th:block th:replace="~{fragments/footer :: dashboardFooter}"></th:block>

    </div>

</div>

<th:block th:replace="~{fragments/scripts :: bootstrapJs}"></th:block>

</body>
</html>
